[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtd-robot"
version = "0.1.0"
description = "Production-grade automated trading system for XAUUSD on Exness MetaTrader 5"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Quant Trading Engineering Team" }
]
dependencies = [
    "MetaTrader5>=5.0.45",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    "pyzmq>=25.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
    "black>=24.2.0",
]
research = [
    "scikit-learn>=1.4.0",
    "pyarrow>=15.0.0",
    "fastparquet>=2024.2.0",
    "scipy>=1.12.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --strict-markers"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
