# ==============================================================================
# MTD-ROBOT SYSTEM SETTINGS
# ==============================================================================
app:
  name: "mtd-robot"
  version: "0.1.0"
  environment: "development" # development | staging | production
  timezone: "UTC"

mt5:
  timeout_ms: 60000
  portable: false
  reconnect_retries: 3
  reconnect_delay_seconds: 5

# ==============================================================================
# QAT'IY XAVFSIZLIK QOIDASI (LIVE GUARD)
# allow_live: false - Haqiqiy pul hisobida savdo qilish MUTLAQO TAQIQLANGAN!
# Faqat 10/10 bosqich to'liq yakunlangach qo'lda yoqiladi.
# ==============================================================================
safety:
  allow_live: false
  require_demo_trade_mode: true
  max_allowed_magic_number: 999999

logging:
  level: "INFO"              # DEBUG | INFO | WARNING | ERROR | CRITICAL
  log_to_console: true
  log_to_file: true
  file_path: "logs/trading.log"
  rotation: "10 MB"
  retention: "30 days"
  compression: "zip"
  mask_secrets: true

bridge:
  protocol: "zmq"
  host: "127.0.0.1"
  heartbeat_interval_seconds: 1.0
  heartbeat_timeout_seconds: 5.0

# QAT'IY STRATEGIYA QOIDASI: FAQAT M3
strategy:
  name: "fu_formation"
  timeframe: "M3"
